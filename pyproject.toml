[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cinderella-rag-lab"
version = "0.1.0"
description = "An inspectable, framework-free RAG learning playground"
requires-python = ">=3.12"
dependencies = [
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "sentence-transformers>=3.0,<6",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
